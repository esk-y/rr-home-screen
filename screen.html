<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rob &amp; Rhonda's Home Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&display=swap">
<!-- Daily video library (pinned version) -->
<script src="https://unpkg.com/@daily-co/daily-js@0.94.0/dist/daily.js"></script>
<!--
  Rob & Rhonda's home screen (Phase 2) - the page the tablet shows all day.
  Open it as:  screen.html?k=TABLET_KEY            (uses the API address below)
          or:  screen.html?k=TABLET_KEY&api=URL    (to point at a different deployment)
  It asks the Apps Script web app for the schedule, messages and calls every few seconds.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f13; }
  .fit { position: fixed; inset: 0; display: grid; place-items: center; }
  .screen {
    /* Low-vision rules: nothing below 26px, nothing in regular weight, no pale gray text */
    --s-bg: #eef2f1; --s-panel: #ffffff; --s-ink: #10181e; --s-muted: #2f3b44; --s-line: #c9d2cf; --s-done: #e7ecea;
    --s-call: #1d7446; --s-call-soft: #e3f2e9; --s-end: #b3261e; --s-next: #fff4d6; --s-next-ink: #7a4b00;
    --rob: #1d5aa6; --rhonda: #94306a; --both: #2c6a3a;
    --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
    position: absolute; top: 0; left: 0; width: 1280px; height: 800px; transform-origin: 0 0;
    background: var(--s-bg); color: var(--s-ink); font-family: var(--font);
    display: grid; grid-template-columns: 384px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 22px; padding: 26px; box-sizing: border-box;
    transition: background .6s, color .6s; user-select: none; -webkit-user-select: none;
  }
  .screen.night {
    --s-bg: #0a0f13; --s-panel: #121a20; --s-ink: #eef3f6; --s-muted: #c3cdd4; --s-line: #33404a; --s-done: #1b252c;
    --s-call: #3f9a67; --s-call-soft: #13241b; --s-next: #2a2210; --s-next-ink: #e2b866;
    --rob: #7fa9e0; --rhonda: #d68bb7; --both: #86c592;
  }
  .col { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--s-panel); border-radius: 18px; padding: 20px 22px; }
  .clock { display: grid; gap: 2px; padding: 6px 1px 0; }
  .time { font-size: 116px; font-weight: 800; line-height: 1; letter-spacing: -3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time small { font-size: 38px; letter-spacing: 0; margin-left: 8px; font-weight: 800; }
  .day { font-size: 58px; font-weight: 800; line-height: 1.05; margin-top: 16px; }
  .part { font-size: 46px; font-weight: 700; line-height: 1.1; }
  .date { font-size: 50px; font-weight: 800; line-height: 1.1; margin-top: 10px; }
  .date .yr { font-size: 40px; font-weight: 700; }
  .offline { font-size: 26px; font-weight: 700; color: var(--s-end); margin-top: 8px; }
  .label { font-size: 28px; font-weight: 800; color: var(--s-ink); }
  /* Call buttons: one big solid button per person, in that person's color, well spaced */
  .calls { display: grid; gap: 12px; margin-top: auto; }
  .callbtn { --c: #2f6f9f; display: flex; align-items: center; gap: 20px; width: 100%; height: 108px; padding: 0 24px 0 18px;
    border-radius: 24px; border: 0; cursor: pointer; text-align: left; background: var(--c); color: #fff; font: 800 42px var(--font);
    box-shadow: 0 5px 0 rgba(0, 0, 0, .28); -webkit-tap-highlight-color: transparent; }
  .callbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); filter: brightness(.88); }
  .callbtn .ic { width: 74px; height: 74px; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; flex: none; }
  .callbtn .ic svg { width: 46px; height: 46px; }
  .screen.night .callbtn { filter: brightness(.8); }
  .avatar { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-size: 30px; color: #fff; }

  .today { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; padding: 22px 26px; }
  .today h2 { margin: 0; font-size: 40px; font-weight: 800; }
  .events { flex: 1; min-height: 0; overflow: hidden; display: grid; align-content: start; gap: 4px; }
  .allday { font-size: 30px; font-weight: 700; }
  .who { font-weight: 800; }
  .who.rob { color: var(--rob); } .who.rhonda { color: var(--rhonda); } .who.both { color: var(--both); }

  /* The one thing to look at: what's next */
  .nextcard { background: var(--s-next); border: 3px solid var(--s-next-ink); border-radius: 18px; padding: 12px 22px 14px; display: grid; gap: 2px; margin-bottom: 6px; }
  .nextcard .nk { font-size: 30px; font-weight: 800; color: var(--s-next-ink); }
  .nextcard .nt { font-size: 46px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .nextcard .nw { font-size: 44px; font-weight: 800; line-height: 1.15; }
  .nextcard .nn { font-size: 30px; font-weight: 700; line-height: 1.25; margin-top: 2px; }

  /* Other items: time and title only; details show when an item becomes Next */
  .row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: baseline; padding: 4px 4px; }
  .row .t { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .what { font-size: 34px; font-weight: 700; line-height: 1.2; }
  .row.done { background: var(--s-done); border-radius: 14px; padding: 8px 14px; }
  .row.done .t, .row.done .what { font-size: 28px; }
  .row.done .tag { font-weight: 800; color: var(--s-call); }
  .sub { font-size: 28px; font-weight: 800; }
  .quiet { font-size: 34px; font-weight: 700; padding: 6px 4px; }
  .more { font-size: 28px; font-weight: 700; padding: 0 4px; }
  .tomorrow { padding-top: 12px; border-top: 3px solid var(--s-line); display: grid; gap: 2px; }
  .tomorrow .row .t { font-size: 30px; }
  .tomorrow .row .what { font-size: 30px; }
  .tomorrow .quiet { font-size: 30px; }

  /* Evening view (6:30 PM to midnight): tomorrow, large and with details */
  .tonight { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 4px solid var(--s-line); margin-bottom: 4px; }
  .tonight .tlabel { font-size: 34px; font-weight: 800; }
  .tmhead { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 2px 4px 6px; }
  .tmhead .tag { font-size: 30px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--both);
    border-radius: 12px; padding: 4px 16px 2px; align-self: center; }
  .screen.night .tmhead .tag { color: #0a0f13; }
  .tmhead .tday { font-size: 44px; font-weight: 800; line-height: 1.1; }
  .trow { display: grid; grid-template-columns: var(--tw, 200px) minmax(0, 1fr); gap: 18px; align-items: baseline; padding: 10px 4px; border-top: 2px solid var(--s-line); }
  .trow .t { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .trow .what { font-weight: 800; line-height: 1.15; }
  .trow .nn { font-weight: 700; line-height: 1.25; margin-top: 4px; }
  .ev-xl { --tw: 220px; } .ev-xl .trow .t, .ev-xl .trow .what { font-size: 46px; } .ev-xl .trow .nn, .ev-xl .tmall { font-size: 32px; }
  .ev-lg { --tw: 190px; } .ev-lg .trow .t, .ev-lg .trow .what { font-size: 40px; } .ev-lg .trow .nn, .ev-lg .tmall { font-size: 30px; }
  .ev-md { --tw: 170px; } .ev-md .trow .t, .ev-md .trow .what { font-size: 34px; } .ev-md .trow .nn, .ev-md .tmall { font-size: 28px; }
  .tmall { font-weight: 700; padding: 0 4px 6px; }
  .tmquiet { font-size: 40px; font-weight: 700; padding: 10px 4px; }

  /* Messages: a card pops over the calendar, then shrinks to a strip until answered */
  .mstrip { display: flex; align-items: center; gap: 16px; width: 100%; padding: 10px 18px 10px 10px; border-radius: 16px; cursor: pointer; text-align: left;
    background: var(--s-call-soft); border: 3px solid var(--s-call); color: var(--s-ink); font: 800 32px var(--font); }
  .mstrip .avatar { width: 52px; height: 52px; font-size: 24px; }
  .mstrip .go { margin-left: auto; font-size: 28px; color: var(--s-call); white-space: nowrap; }
  .mcard { width: 860px; max-width: 860px; }
  .mcard .from { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 800; }
  .mcard .body { font-size: 46px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .mcard .replies { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-top: 6px; }
  .reply { font: 800 34px var(--font); padding: 20px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
    border: 0; color: #fff; background: var(--s-call); }
  .reply.callme { background: var(--rob); }
  .reply svg { width: 36px; height: 36px; }
  .mcard .later { font-size: 28px; font-weight: 700; color: var(--s-muted); }
  .mcard .sentmsg { font-size: 44px; font-weight: 700; color: var(--s-call); }

  .overlay { position: absolute; inset: 0; background: var(--s-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .overlay .big { width: 200px; height: 200px; font-size: 92px; }
  .overlay h3 { margin: 0; font-size: 62px; }
  .overlay p { margin: 0; font-size: 32px; color: var(--s-muted); }
  .ring { animation: ring 1.2s ease-in-out infinite; }
  @keyframes ring { 50% { transform: scale(1.06); } }
  .video { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #3a3f4c, #15181d 70%); display: grid; place-items: center; color: #e4e8ee; }
  .video #vremote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .video #vself { position: absolute; right: 24px; top: 24px; width: 260px; height: 195px; object-fit: cover; border-radius: 18px;
    border: 4px solid #fff; background: #222; transform: scaleX(-1); }
  .video .face { position: relative; display: grid; gap: 14px; justify-items: center; font-size: 34px; font-weight: 700; }
  .callbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 30px; display: flex; align-items: center; gap: 20px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 34px; font-weight: 700; }
  .hangup { margin-left: auto; font: 800 34px var(--font); color: #fff; background: var(--s-end); border: 0; border-radius: 20px; padding: 20px 46px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
  .hangup svg { width: 34px; height: 34px; }
  .cancel { font: 800 42px var(--font); color: #fff; background: var(--s-end); border: 0; border-radius: 22px; padding: 22px 100px; cursor: pointer; margin-top: 14px;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .28); }
  .remind { position: absolute; inset: 0; background: rgba(10, 15, 19, .55); display: grid; place-items: center; }
  .remind .box { background: var(--s-panel); color: var(--s-ink); border-radius: 28px; padding: 44px 60px; max-width: 920px;
    display: grid; gap: 22px; justify-items: center; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .remind .kicker { font-size: 26px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--s-next-ink); }
  .remind .rmsg { font-size: 54px; font-weight: 700; line-height: 1.2; }
  .remind .rsub { font-size: 34px; color: var(--s-muted); line-height: 1.3; }
  .remind .ok { font: 800 40px var(--font); background: var(--s-call); color: #fff; border: 0; border-radius: 20px; padding: 18px 96px; cursor: pointer; margin-top: 8px; }
  .setup { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; padding: 60px; text-align: center; background: var(--s-bg); }
  /* View-only copy for family (screen.html?f=FAMILY_KEY): a status bar above the screen */
  .viewbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px;
    background: #0a0f13; color: #eef3f6; font: 600 16px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .viewbar .dot { width: 12px; height: 12px; border-radius: 50%; background: #3fbf6f; flex: none; }
  .viewbar.warn .dot { background: #e2b866; }
  .viewbar.bad { background: #4a1512; }
  .viewbar.bad .dot { background: #ff6b60; }
  .viewbar .vo { color: #b8c4cc; font-weight: 500; }
  .viewbar a { margin-left: auto; color: #fff; white-space: nowrap; padding: 8px 0 8px 8px; }
  body.viewing .fit { top: 56px; }
  .screen.viewonly { pointer-events: none; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } .screen { transition: none; } }
</style>
</head>
<body>
<div class="viewbar" id="viewbar" hidden></div>
<div class="fit" id="fit">
  <div class="screen" id="screen">
    <div class="col">
      <div class="clock">
        <div class="time" id="time"></div>
        <div class="day" id="day"></div>
        <div class="date" id="date"></div>
        <div class="offline" id="offline" hidden>Reconnecting… showing the last saved schedule.</div>
      </div>
      <div class="calls">
        <div id="contacts" style="display:grid;gap:18px"></div>
      </div>
    </div>
    <div class="col">
      <div class="card today">
        <div id="mstrip"></div>
        <h2 id="todayHead">Today</h2>
        <div id="allday"></div>
        <div class="events" id="events"></div>
        <div class="tomorrow" id="tomorrow"></div>
      </div>
    </div>
    <div class="remind" id="msgcard" hidden></div>
    <div class="remind" id="remind" hidden></div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="setup" id="setup" hidden></div>
  </div>
</div>

<script>
(function () {
  // Address of the Apps Script web app (the /exec link). Can be overridden with &api= in the page link.
  var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbw1JY_JS05U7am_wtUvLvs_LHjv2hGKldUsoUTF_KLy2wmmtXIdI6fNDEzT12X0Q0YkDg/exec';
  var TZ = 'America/Los_Angeles';
  var COUNTDOWN = 5;          // seconds before an incoming call connects
  var POLL_IDLE = 10000;      // ms between checks normally
  var POLL_CALL = 3000;       // ms between checks while a call is happening

  var qs = new URLSearchParams(location.search);
  var KEY = qs.get('k') || '';
  var FKEY = qs.get('f') || '';      // a family link: view-only copy (no sound, no buttons, no video)
  var VIEW = !KEY && !!FKEY;
  var API = qs.get('api') || DEFAULT_API;

  var $ = function (id) { return document.getElementById(id); };
  var screen = $('screen'), fit = $('fit'), overlay = $('overlay');
  var data = null, failures = 0, pollTimer = null;
  var callUi = null;          // { id, name, color, phase: 'countdown' | 'calling' | 'live' | 'ended' }
  var timers = [];

  // Fit the 1280x800 design to the screen. Re-checked every second, because a page
  // that loads while hidden (e.g. behind another app) measures the screen as 0 x 0.
  var lastFit = '';
  function scale() {
    var w = fit.clientWidth, h = fit.clientHeight;
    if (!w || !h || w + 'x' + h === lastFit) return;
    lastFit = w + 'x' + h;
    var s = Math.min(w / 1280, h / 800);
    screen.style.transform = 'translate(' + (w - 1280 * s) / 2 + 'px,' + (h - 800 * s) / 2 + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', scale);
  document.addEventListener('visibilitychange', scale);
  scale();

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ----- Time in Grass Valley, whatever the device's own time zone -----
  var fmtParts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hourCycle: 'h23' });
  function pacific(real) {
    var o = {};
    fmtParts.formatToParts(new Date()).forEach(function (p) { o[p.type] = p.value; });
    var h = Number(o.hour) % 24, m = Number(o.minute);
    var fake = qs.get('demo') && /^(\d{1,2}):(\d\d)$/.exec(qs.get('now') || '');   // for reviewing the layout only
    if (fake && !real) { h = Number(fake[1]) % 24; m = Number(fake[2]); }
    return { h: h, m: m, mins: h * 60 + m, weekday: o.weekday, month: o.month, day: o.day, year: o.year };
  }
  function partOf(h) { return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : h < 20 ? 'Evening' : 'Night'; }

  var lastMinute = -1;
  function tick() {
    scale();
    var p = pacific();
    $('time').innerHTML = (p.h % 12 || 12) + ':' + String(p.m).padStart(2, '0') + '<small>' + (p.h < 12 ? 'AM' : 'PM') + '</small>';
    $('day').textContent = p.weekday;
    $('date').innerHTML = esc(p.month + ' ' + p.day) + '<br><span class="yr">' + esc(p.year) + '</span>';
    screen.classList.toggle('night', p.h >= 20 || p.h < 6);
    if (p.mins !== lastMinute) { lastMinute = p.mins; renderEvents(); checkReminders(); renderMessages(); }
    viewStatus();
  }

  // ----- View-only copy: is the real tablet checking in? -----
  var seenInfo = null, offlineMinutes = 60;
  var fmtSeen = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  var fmtDay = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  function seenLabel(ms) {
    var d = new Date(ms), same = fmtDay.format(d) === fmtDay.format(new Date());
    return (same ? '' : fmtDay.format(d) + ', ') + fmtSeen.format(d);
  }
  function viewStatus() {
    if (!VIEW) return;
    var cls = '', txt;
    if (failures >= 3) { cls = 'warn'; txt = 'Can\'t reach the server. Showing the last update.'; }
    else if (!seenInfo) txt = 'Loading…';
    else if (!seenInfo.seen) { cls = 'warn'; txt = 'The tablet hasn\'t checked in yet.'; }
    else {
      var age = seenInfo.age + (Date.now() - seenInfo.fetchedAt), s = Math.max(1, Math.round(age / 1000));
      if (s < 120) txt = 'Tablet online · checked in ' + s + ' sec ago';
      else if (age < offlineMinutes * 60000) { cls = 'warn'; txt = 'Tablet hasn\'t checked in for ' + Math.round(s / 60) + ' min'; }
      else { cls = 'bad'; txt = 'Tablet offline since ' + seenLabel(seenInfo.seen); }
    }
    var bar = $('viewbar');
    bar.className = 'viewbar' + (cls ? ' ' + cls : '');
    var html = '<span class="dot"></span><span>' + esc(txt) + ' <span class="vo">· View only</span></span>' +
      '<a href="family.html?f=' + encodeURIComponent(FKEY) + '">My page</a>';
    if (bar.innerHTML !== html) bar.innerHTML = html;
  }

  // ----- Schedule -----
  function whoTitle(ev) {
    return (ev.who ? '<span class="who ' + esc(ev.who) + '">' + esc(ev.whoLabel) + ':</span> ' : '') + esc(ev.title);
  }
  // A plain row: time and title only
  function rowHtml(ev, cls) {
    return '<div class="row ' + (cls || '') + '"><div class="t">' + (ev.allDay ? 'All day' : esc(ev.time)) + '</div>' +
      '<div class="what">' + (cls === 'done' ? '<span class="tag">✓ Done:</span> ' : '') + whoTitle(ev) + '</div></div>';
  }
  // The big card for what's happening now or next, with its details
  function nextHtml(ev, kicker) {
    return '<div class="nextcard"><div class="nk">' + kicker + '</div>' +
      '<div class="nt">' + esc(ev.time) + '</div>' +
      '<div class="nw">' + whoTitle(ev) + '</div>' +
      (ev.notes.length ? '<div class="nn">' + ev.notes.slice(0, 3).map(esc).join('<br>') + '</div>' : '') + '</div>';
  }

  function waitText(mins) {
    if (mins < 60) return 'in ' + mins + (mins === 1 ? ' minute' : ' minutes');
    var h = Math.round(mins / 60);
    return 'in about ' + h + (h === 1 ? ' hour' : ' hours');
  }

  var EVENING_FROM = 18 * 60 + 30;   // from 6:30 PM the calendar shows tomorrow
  var fmtTmDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'long', day: 'numeric' });

  function renderEvents() {
    if (!data) return;
    var now = pacific().mins, cal = data.cal;
    var evening = now >= EVENING_FROM;
    $('todayHead').hidden = evening;
    $('allday').hidden = evening;
    $('tomorrow').hidden = evening;
    if (evening) return renderEvening(now, cal);
    var allDay = cal.today.filter(function (i) { return i.allDay; });
    var timed = cal.today.filter(function (i) { return !i.allDay; });

    $('allday').innerHTML = allDay.length ? '<div class="allday">All day: ' + allDay.map(whoTitle).join(' · ') + '</div>' : '';

    var done = timed.filter(function (i) { return i.e <= now; });
    var rest = timed.filter(function (i) { return i.e > now; });   // [0] is now or next
    var later = rest.slice(1);

    // Finished item (if room), the big Next card, then a few later items by time and title
    function draw(keepDone, n) {
      if (!timed.length) return allDay.length ? '' : '<div class="quiet">Nothing scheduled today. Enjoy a quiet day.</div>';
      var html = keepDone && done.length ? rowHtml(done[done.length - 1], 'done') : '';
      if (!rest.length) return html + '<div class="quiet">That\'s everything for today.</div>';
      var first = rest[0];
      html += nextHtml(first, first.s <= now ? 'Happening now' : 'Next, ' + waitText(first.s - now));
      if (n > 0) html += '<div class="sub">Later today</div>' + later.slice(0, n).map(function (ev) { return rowHtml(ev); }).join('');
      if (later.length > n) html += '<div class="more">and ' + (later.length - n) + ' more later today</div>';
      return html;
    }

    function draw() {
      overlay.hidden = false;
      overlay.innerHTML = avatar(f.name, f.color, 'big') + '<h3>Calling ' + esc(f.name) + ' in ' + left + '…</h3>' +
        '<p>Tap Cancel to stop.</p><button class="cancel" id="cancel">Cancel</button>';
      $('cancel').onclick = function () {
        clearTimers(); callUi = null; overlay.hidden = true; overlay.innerHTML = ''; renderMessages();
      };
    }
    function step() {
      left--;
      if (left > 0) { draw(); later(step, 1000); return; }
      callUi.phase = 'calling';
      overlay.innerHTML = '<div class="ring">' + avatar(f.name, f.color, 'big') + '</div><h3>Calling ' + esc(f.name) + '…</h3><p>Waiting for ' + esc(f.name) + ' to answer.</p>' +
        '<button class="cancel" id="cancel">Cancel</button>';
      $('cancel').onclick = hangUp;
      api({ a: 'call', to: to }).then(function (j) {
        // Cancelled while the call was being set up: end it quietly, no alert
        if (!callUi || callUi.phase !== 'calling') { api({ a: 'endcall', id: j.call.id }).catch(function () {}); return; }
        callUi.id = j.call.id; callUi.since = Date.now();
        sendAlert(j.alert);
        poll();
      }).catch(function () { ended('Could not call right now'); });
    }
    draw();
    later(step, 1000);
  }

  // ----- Live video (Daily). Our own simple screen: them full-size, a small picture of
  //       Rob & Rhonda, and one Hang up button - no other controls to press by mistake -----
  var co = null;

  function remoteCount() {
    if (!co) return 0;
    return Object.keys(co.participants()).filter(function (k) { return k !== 'local'; }).length;
  }

  function onTrack(ev) {
    if (!ev || !ev.participant || !ev.track) return;
    var local = ev.participant.local, stopped = ev.type === 'track-stopped';
    if (ev.track.kind === 'video') {
      var v = $(local ? 'vself' : 'vremote');
      if (v) v.srcObject = stopped ? null : new MediaStream([ev.track]);
      if (!local && !stopped && $('vwait')) $('vwait').hidden = true;
    } else if (ev.track.kind === 'audio' && !local) {
      var a = $('vaudio');
      if (a) { a.srcObject = stopped ? null : new MediaStream([ev.track]); if (!stopped) a.play().catch(function () {}); }
    }
  }

  function videoProblem() {
    var w = $('vwait');
    if (w) { w.hidden = false; w.lastChild.textContent = 'Video didn\'t connect. Tap Hang up and try again.'; }
  }

  // Daily allows only one call at a time, so finish closing any earlier one first
  function startVideo(c) {
    if (!c.room || !window.Daily) return;
    var callId = c.id;
    var old = Daily.getCallInstance && Daily.getCallInstance();
    Promise.resolve(old ? old.destroy() : null).catch(function () {}).then(function () {
      if (!callUi || callUi.id !== callId || callUi.phase !== 'live') return;   // call already over
      try {
        co = Daily.createCallObject();
        co.on('track-started', onTrack).on('track-stopped', onTrack)
          .on('participant-left', function () {
            // If the other person has gone, end the call here too
            later(function () { if (callUi && callUi.phase === 'live' && remoteCount() === 0) hangUp(); }, 8000);
          })
          .on('error', function (e) { console.error('Video error', e); videoProblem(); });
        co.join({ url: c.room, token: c.token }).catch(function (e) { console.error('Join failed', e); videoProblem(); });
      } catch (e) {
        console.error('Video failed', e);
        co = null;
        videoProblem();
      }
    });
  }

  function stopVideo() {
    if (!co) return;
    var x = co; co = null;
    try { x.destroy().catch(function () {}); } catch (e) {}
  }

  function connected(c) {
    clearTimers();
    callUi = { id: c.id, name: c.name, color: c.color, phase: 'live', since: Date.now() };
    var t0 = Date.now();
    overlay.hidden = false;
    var hasVideo = !!(c.room && window.Daily);
    overlay.innerHTML = '<div class="video">' +
      (hasVideo ? '<video id="vremote" autoplay playsinline></video><video id="vself" autoplay playsinline muted></video><audio id="vaudio" autoplay></audio>' : '') +
      '<div class="face" id="vwait">' + avatar(c.name, c.color, 'big') +
      (hasVideo ? 'Connecting to ' + esc(c.name) + '…' : 'Video connects here once it\'s set up') + '</div></div>' +
      '<div class="callbar"><span>Talking with ' + esc(c.name) + ' · <span id="dur">0:00</span></span>' +
      '<button class="hangup" id="hangup">' + PHONE + 'Hang up</button></div>';
    $('hangup').onclick = hangUp;
    if (hasVideo) {
      startVideo(c);
      // If the other person never shows up (or video never starts), give up after 2 minutes
      later(function () { if (callUi && callUi.phase === 'live' && remoteCount() === 0) hangUp(); }, 120000);
    }
    (function run() {
      var s = Math.floor((Date.now() - t0) / 1000), el = $('dur');
      if (el) { el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); later(run, 1000); }
    })();
    poll();
  }

  function hangUp() {
    var id = callUi && callUi.id;
    ended('Call ended');
    if (id) api({ a: 'endcall', id: id }).catch(function () {});
  }

  function ended(text) {
    stopVideo();
    clearTimers();
    if (callUi) callUi.phase = 'ended';
    overlay.hidden = false;
    overlay.innerHTML = '<h3>' + esc(text) + '</h3>';
    later(function () { overlay.hidden = true; overlay.innerHTML = ''; callUi = null; renderMessages(); }, 2500);
  }

  $('contacts').addEventListener('click', function (e) {
    var b = e.target.closest('.callbtn'); if (b) outgoing(b.getAttribute('data-to'));
  });

  // ----- Start -----
  if (VIEW) {
    document.body.classList.add('viewing');
    screen.classList.add('viewonly');
    $('viewbar').hidden = false;
    document.title = 'Rob & Rhonda\'s screen (view only)';
    lastFit = '';
  }
  tick(); setInterval(tick, 1000);
  // Re-fit the schedule once the large font has loaded (it changes text sizes)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { renderEvents(); });
  if ((!KEY && !FKEY) || !API) {
    $('setup').hidden = false;
    $('setup').textContent = 'This screen needs its setup link. Eric can fix this remotely.';
    return;
  }
  var saved = restore();
  if (saved) { saved.call = null; apply(saved); }
  poll();
})();
</script>
</body>
</html>
